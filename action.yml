name: 'Deadlink Scan'
description: 'Scan source files and public live routes for dead links'
inputs:
  config-path:
    description: 'Path to deadlink.config.yml in the checked-out repository'
    required: false
    default: 'deadlink.config.yml'
  token:
    description: 'GitHub token for creating or updating Dead Links issues'
    required: true
  skip-live-crawl:
    description: 'If true, only scan source files'
    required: false
    default: 'false'
runs:
  using: 'composite'
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '24'
    - name: Install action dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --omit=dev && npx playwright install chromium --with-deps
    - name: Run deadlink check
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        INPUT_CONFIG_PATH: ${{ inputs.config-path }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_SKIP_LIVE_CRAWL: ${{ inputs.skip-live-crawl }}
      run: node dist/index.js
    - name: Upload deadlink report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: deadlink-report
        path: deadlink-report.json
        if-no-files-found: ignore
